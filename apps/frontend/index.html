<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content : le clavier virtuel redimensionne la
         page (Chrome Android) au lieu de la recouvrir — utile sur le tableau
         blanc/chat de la salle d'appel. viewport-fit=cover : contenu sous
         l'encoche/la barre d'accueil (iPhone) plutôt que des bandes noires. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>webinairev2</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
