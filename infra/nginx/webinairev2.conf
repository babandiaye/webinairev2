# -------------------------
# REDIRECTION HTTP -> HTTPS
# -------------------------
server {
    listen 80;
    server_name preprod-webinairev2.unchk.sn;
    return 301 https://$host$request_uri;
}

# -------------------------
# VHOST HTTPS — frontend statique + API NestJS
# -------------------------
server {
    listen 443 ssl http2;
    server_name preprod-webinairev2.unchk.sn;

    ssl_certificate /etc/nginx/ssl/unchk.sn_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/star_unchk.sn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend React (build statique, pas de process Node)
    root /var/www/html/webinairev2/apps/frontend/dist;
    index index.html;

    # API NestJS (/api/rooms -> 127.0.0.1:4010/rooms, etc.) — le webhook LiveKit
    # (POST /api/webhooks/livekit) passe aussi par ce même préfixe, pas de bloc dédié.
    location /api/ {
        # Défaut nginx = 1 Mo : bloque silencieusement (413) tout PDF de présentation
        # un peu volumineux avant même d'atteindre le backend (limite applicative
        # MAX_UPLOAD_BYTES = 50 Mo dans presentations.controller.ts).
        client_max_body_size 50m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://127.0.0.1:4010/;
    }

    # Fichiers produits par Vite : leur nom porte un hash du contenu, qui change
    # à chaque build. Ils sont donc immuables sous un nom donné et peuvent être
    # gardés indéfiniment par le navigateur.
    #
    # `=404` est la partie IMPORTANTE, pas le cache. Sans bloc dédié, ces
    # requêtes tombaient dans `location /` et son `try_files $uri /index.html` :
    # un fichier absent — parce que le frontend a été rebuildé depuis que le
    # navigateur a mis index.html en cache — renvoyait index.html en 200 avec
    # un Content-Type text/html. Le navigateur recevait du HTML là où il
    # attendait du JavaScript, échouait à l'analyser, et l'application ne
    # démarrait jamais : page muette, aucun appel d'API, aucune redirection
    # vers Keycloak, et RIEN dans les logs puisque tout répondait 200.
    # Constaté en production le 2026-08-02, résolu côté utilisateur en vidant
    # le cache. Avec =404, l'échec devient visible et diagnosticable.
    #
    # add_header remplace (et non complète) ceux du bloc server dès qu'un
    # location en déclare un : les quatre en-têtes de sécurité doivent être
    # répétés ici, sinon ils disparaissent silencieusement sur ces réponses.
    location /assets/ {
        try_files $uri =404;
        # SANS `always`, délibérément : add_header sans ce mot-clé ne s'applique
        # qu'aux réponses abouties. Avec, le 404 ci-dessus repartait lui aussi
        # en « immuable pendant un an » — le navigateur aurait mémorisé
        # l'absence du fichier, et un retour arrière de déploiement remettant ce
        # nom en service n'aurait jamais été revu.
        # Les en-têtes de sécurité, eux, gardent `always` : ils doivent couvrir
        # les réponses d'erreur aussi.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Page ouverte par le Chrome headless de LiveKit Web Egress. Le token
    # d'autorisation voyage en fragment d'URL (jamais envoyé au serveur), mais
    # cette requête initiale (GET /egress-view/:roomId) reste journalisée par
    # défaut — access_log off en défense en profondeur, indépendamment de ce que
    # peuvent journaliser LiveKit/le conteneur egress de leur côté.
    location /egress-view/ {
        access_log off;
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html, lui, ne porte PAS de hash : c'est lui qui désigne la version
    # des fichiers à charger. Il doit donc être revalidé à chaque chargement,
    # sinon un navigateur continue de réclamer les fichiers d'un build disparu.
    # Sans directive explicite, nginx n'envoie qu'ETag/Last-Modified et le
    # navigateur applique sa propre heuristique — c'est ce qui a permis à un
    # index.html périmé de survivre à plusieurs déploiements.
    # `no-cache` n'interdit pas la mise en cache : il impose la revalidation,
    # donc un 304 de quelques octets quand rien n'a changé.
    # Ce bloc couvre aussi les routes SPA (/rooms/:id…) : try_files provoque
    # une redirection interne vers /index.html, qui repasse par le choix de
    # location. Il couvre enfin favicon/apple-touch-icon, dont la revalidation
    # est négligeable.
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
