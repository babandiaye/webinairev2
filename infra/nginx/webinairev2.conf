# -------------------------
# REDIRECTION HTTP -> HTTPS
# -------------------------
server {
    listen 80;
    server_name preprod-webinairev2.unchk.sn;
    return 301 https://$host$request_uri;
}

# -------------------------
# VHOST HTTPS — frontend statique + API NestJS
# -------------------------
server {
    listen 443 ssl http2;
    server_name preprod-webinairev2.unchk.sn;

    ssl_certificate /etc/nginx/ssl/unchk.sn_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/star_unchk.sn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend React (build statique, pas de process Node)
    root /var/www/html/webinairev2/apps/frontend/dist;
    index index.html;

    # API NestJS (/api/rooms -> 127.0.0.1:4010/rooms, etc.)
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;

        proxy_pass http://127.0.0.1:4010/;
    }

    # Webhook LiveKit (appelé directement par le SFU, pas par le frontend) —
    # à activer côté /opt/livekit/livekit-server.yaml au jalon 2 (recordings).
    location /webhooks/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:4010/webhooks/;
    }

    location / {
        try_files $uri /index.html;
    }
}
